<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knights Prime AI - Leonardo</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0a0a0f; color: #fff; }
  header { padding: 20px; text-align: center; background: linear-gradient(90deg, #ff00ff, #00d4ff); }
  header h1 { font-size: 1.8rem; }
  header p { opacity: 0.8; }
  .tabs { display: flex; justify-content: center; margin: 20px 0; gap: 10px; }
  .tab-btn { padding: 12px 20px; border: none; background: #1a1a2e; color: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .tab-btn.active { background: linear-gradient(90deg, #ff00ff, #00d4ff); }
  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .tab { display: none; }
  .tab.active { display: block; }
  iframe { width: 100%; height: 800px; border: none; border-radius: 12px; background: #111; }
  .note { text-align: center; color: #aaa; font-size: 0.9rem; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>⚔️ Knights Prime AI</h1>
  <p>Powered by Leonardo.ai</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('image', this)">AI Image Generator</button>
  <button class="tab-btn" onclick="showTab('video', this)">AI Video Generator</button>
</div>

<div class="container">
  <!-- IMAGE TAB -->
  <div id="image" class="tab active">
    <iframe src="https://app.leonardo.ai/image-generation"></iframe>
    <p class="note">Login with Google inside the frame to generate unlimited images</p>
  </div>

  <!-- VIDEO TAB -->
  <div id="video" class="tab">
    <iframe src="https://app.leonardo.ai/ai-video"></iframe>
    <p class="note">Login with Google inside the frame to generate AI videos with Motion</p>
  </div>
</div>

<script>
  function showTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    btn.classList.add('active');
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knights Prime AI - Image</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --gold:#FFD700; --card:rgba(25,25,25,0.85); --red:#ff3333; }
* { box-sizing: border-box; }
body { font-family: 'Poppins'; background:#000; color:#fff; padding:10px; margin:0; }
.header { text-align:center; padding:15px; }
h1 { font-family: 'Cinzel'; color:var(--gold); margin:0; font-size:22px; }
.tab-wrap { display:flex; gap:6px; margin:10px 0; }
.tab { flex:1; padding:12px; background:var(--card); border-radius:12px; cursor:pointer; font-size:12px; text-align:center; font-weight:600; }
.tab.active { background:var(--gold); color:#000; }
.box { background:var(--card); padding:18px; border-radius:18px; margin:12px 0; }
input, textarea { width:100%; padding:14px; margin:10px 0; border-radius:12px; border:1px solid #444; background:#111; color:#fff; font-size:15px; }
.btn { width:100%; padding:16px; border-radius:14px; border:none; background:var(--gold); color:#000; font-weight:800; cursor:pointer; font-size:16px; margin-top:10px; }
.btn-danger { background:var(--red); color:#fff; font-size:12px; padding:8px; }
img { width:100%; border-radius:16px; margin:12px 0; background:#000; }
.post { background:#111; padding:16px; border-radius:18px; margin:14px 0; }
.post b { color:var(--gold); }
</style>
</head>
<body>

<div class="header"><h1>👑 KNIGHTS PRIME AI</h1></div>

<div class="tab-wrap">
  <div class="tab active" onclick="showTab('ai', this)">1. AI Generate</div>
  <div class="tab" onclick="showTab('postbook', this)">2. 🌍 Feed</div>
</div>

<!-- TAB 1: AI IMAGE ONLY -->
<div id="ai" class="box">
  <h3>AI Image Generator</h3>
  <input id="userNameAI" placeholder="Enter Your Name"/>
  <textarea id="prompt" placeholder="Describe your image... 
Ex: luxury gold king sitting on throne" rows="4"></textarea>
  <button class="btn" onclick="generateAndPost()">Generate & Post ✨</button>
  <img id="resultImg" style="display:none;"/>
</div>

<!-- TAB 2: FEED -->
<div id="postbook" class="box" style="display:none;">
  <h3>🌍 LIVE FEED</h3>
  <p id="status">Loading...</p>
  <div id="feed"></div>
</div>

<script>
const BIN_ID = "6a69cc51da38895dfe9f2c21"; // YOUR BIN
const API_KEY = "$2a$10$CjKdlLbamwTX2LMTISKVt.j0Q0.98y/N4EWPbQo4AOMQoxn2Y2o7W"; // YOUR KEY
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let posts = []; 
let myName = localStorage.getItem('knights_name') || '';

document.getElementById('userNameAI').value = myName;
document.getElementById('userNameAI').oninput = e => { 
  myName = e.target.value; 
  localStorage.setItem('knights_name', myName); 
}

function showTab(id, el){
  document.querySelectorAll('.box').forEach(b=>b.style.display='none');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).style.display='block'; 
  el.classList.add('active');
  if(id==='postbook') loadFeed();
}

async function loadFeed(){
  document.getElementById('status').innerText = "Loading...";
  try {
    let res = await fetch(API_URL + "/latest", {headers:{"X-Master-Key": API_KEY}});
    let data = await res.json();
    posts = data.record.posts || [];
    renderFeed();
    document.getElementById('status').innerText = posts.length === 0? "No posts yet - Be the first!" : "";
  } catch(e) {
    document.getElementById('status').innerText = "ERROR: Check internet";
  }
}

async function savePosts(){
  await fetch(API_URL, { 
    method: "PUT", 
    headers: {"Content-Type": "application/json", "X-Master-Key": API_KEY}, 
    body: JSON.stringify({posts}) 
  });
}

async function generateAndPost(){ 
  let name = document.getElementById('userNameAI').value || "Anonymous"; 
  let prompt = document.getElementById('prompt').value; 
  if(!prompt) return alert("Type a prompt first");
  
  document.querySelector('.btn').innerText = "Generating...";
  
  let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true`; 
  
  document.getElementById('resultImg').src = imgUrl; 
  document.getElementById('resultImg').style.display='block'; 
  
  posts.unshift({
    id:Date.now(), 
    type:'image', 
    name, 
    content:prompt, 
    media:imgUrl, 
    likes:0, 
    comments:[], 
    time:new Date().toLocaleString()
  }); 
  
  await savePosts(); 
  document.querySelector('.btn').innerText = "Generate & Post ✨";
  showTab('postbook', document.querySelectorAll('.tab')[1]); 
}

function renderFeed(){
  document.getElementById('feed').innerHTML = posts.map(p => `
    <div class="post">
      <b>${p.name}</b> <span style="font-size:10px; color:#aaa;">${p.time}</span>
      <img src="${p.media}"/>
      <p>${p.content}</p>
      <div>
        <button onclick="likePost(${p.id})">❤️ ${p.likes}</button>
        <button onclick="commentPost(${p.id})">💬 ${p.comments.length}</button>
        ${p.name === myName? `<button class="btn-danger" onclick="deletePost(${p.id})">🗑️ Delete</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function likePost(id){ 
  posts.find(p=>p.id===id).likes++; 
  await savePosts(); 
  renderFeed(); 
}

async function commentPost(id){ 
  let c = prompt("Write comment:"); 
  if(c){ 
    posts.find(p=>p.id===id).comments.push(myName + ": " + c); 
    await savePosts(); 
    renderFeed(); 
  } 
}

async function deletePost(id){ 
  if(confirm("Delete this post?")){
    posts = posts.filter(p=>p.id!==id); 
    await savePosts(); 
    renderFeed(); 
  } 
}

loadFeed(); 
setInterval(loadFeed, 20000); // refresh every 20s
</script>
</body>
</html>

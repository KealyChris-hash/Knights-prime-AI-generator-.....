<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knights Prime AI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#FFD700;
  --gold-dark:#B8860B;
  --bg:#070707;
  --glass:rgba(15,15,15,0.7);
  --card:rgba(25,25,25,0.8);
}
* { box-sizing:border-box; }
body {
  font-family: 'Poppins';
  background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000 100%);
  color:#fff; text-align:center; padding:0; margin:0; min-height:100vh;
}
.header {
  padding:20px 10px 10px;
  background: linear-gradient(180deg, rgba(255,215,0,0.1) 0%, transparent 100%);
}
h1 {
  font-family: 'Cinzel';
  color:var(--gold);
  font-size:26px;
  font-weight:800;
  text-shadow:0 0 20px rgba(255,215,0,0.5);
  margin:0;
  letter-spacing:2px;
}
.tagline { color:#aaa; font-size:12px; margin:5px 0 15px; }

.tab-wrap {
  display:flex; justify-content:center; gap:10px; margin:0 10px 15px;
}
.tab {
  flex:1; padding:12px 5px; background:var(--card);
  border:1px solid #333; border-radius:14px; cursor:pointer;
  font-size:12px; font-weight:600; transition:all 0.3s;
  backdrop-filter:blur(20px);
}
.tab.active {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color:#000;
  box-shadow:0 0 20px rgba(255,215,0,0.6);
  transform: translateY(-2px);
}

.box {
  background:var(--card);
  padding:20px 15px;
  border-radius:20px;
  margin:0 10px 20px;
  border:1px solid #333;
  backdrop-filter:blur(20px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.box h3 { font-family:'Cinzel'; color:var(--gold); margin:0 0 15px; font-size:16px; }

input, textarea, select {
  width:100%; padding:14px; margin:10px 0;
  border-radius:12px; border:1px solid #444;
  background:#111; color:#fff; font-size:14px;
  transition: all 0.3s;
}
input:focus, textarea:focus, select:focus {
  outline:none; border-color:var(--gold); box-shadow:0 0 10px rgba(255,215,0,0.3);
}

.btn {
  width:100%; padding:14px; margin:10px 0;
  border-radius:12px; border:none;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color:#000; font-weight:700; font-size:15px; cursor:pointer;
  transition: all 0.3s;
}
.btn:active { transform: scale(0.97); }
.btn:hover { transform: translateY(-2px); box-shadow:0 5px 20px rgba(255,215,0,0.5); }

img, canvas, video {
  width:100%; border-radius:16px; margin-top:15px;
  border:2px solid #333; background:#000;
}

#loader { display:none; color:var(--gold); font-weight:600; }

.effect-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  max-height:240px; overflow-y:auto; padding:5px;
}
.effect-grid::-webkit-scrollbar { width:6px; }
.effect-grid::-webkit-scrollbar-thumb { background:var(--gold); border-radius:10px; }
.effect-btn {
  padding:10px; font-size:12px; background:#1a1a1a;
  color:#fff; border:1px solid #333; border-radius:10px;
  transition:all 0.2s; cursor:pointer;
}
.effect-btn.active {
  background:var(--gold); color:#000; font-weight:700;
  box-shadow:0 0 10px var(--gold);
}
</style>
</head>
<body>

<div class="header">
  <h1>👑 KNIGHTS PRIME</h1>
  <p class="tagline">AI STUDIO | Type. Upload. Animate.</p>
</div>

<div class="tab-wrap">
  <div class="tab active" onclick="showTab('gen', this)">AI Generate</div>
  <div class="tab" onclick="showTab('style', this)">Style</div>
  <div class="tab" onclick="showTab('video', this)">Video</div>
</div>

<!-- TAB 1 -->
<div id="gen" class="box">
  <h3>Text → Real AI Photo</h3>
  <textarea id="prompt" rows="3" placeholder="Describe your image... Example: Realistic Nigerian king in agbada"></textarea>
  <button class="btn" onclick="generateImage()">Generate ✨</button>
  <div id="loader">Summoning AI... 10s ⏳</div>
  <img id="resultImg" style="display:none;"/>
  <a id="download" style="display:none;"><button class="btn">Download</button></a>
</div>

<!-- TAB 2 -->
<div id="style" class="box" style="display:none;">
  <h3>Upload → Style → Animate</h3>
  <input type="file" id="upload" accept="image/*">
  <select id="styleSelect">
    <option value="cartoon">Cartoon</option><option value="anime">Anime</option>
    <option value="oil">Oil Painting</option><option value="cyberpunk">Cyberpunk</option>
    <option value="sketch">Pencil Sketch</option>
  </select>
  <select id="animSelect">
    <option value="none">No Animation</option><option value="pan">Cinematic Pan</option>
    <option value="zoomin">Zoom In</option><option value="glow">Magic Glow</option>
  </select>
  <button class="btn" onclick="processImage()">Create</button>
  <canvas id="styleCanvas" width="512" height="512"></canvas>
  <video id="outputVideo" controls style="display:none;"></video>
  <a id="downloadStyle" style="display:none;"><button class="btn">Download</button></a>
</div>

<!-- TAB 3 -->
<div id="video" class="box" style="display:none;">
  <h3>Video Director</h3>
  <textarea id="videoPrompt" rows="2" placeholder="Describe scene: dragon flying and eating human"></textarea>
  <input type="file" id="uploadVideo" accept="image/*" multiple>
  <p style="font-size:11px; color:#888;">Upload 1-5 photos. First = Main object</p>
  <div class="effect-grid" id="effectGrid"></div>
  <button class="btn" onclick="makeVideo()">Generate Video</button>
  <canvas id="videoCanvas" width="512" height="512"></canvas>
  <video id="finalVideo" controls style="display:none;"></video>
  <a id="downloadVideo" style="display:none;"><button class="btn">Download Video</button></a>
</div>

<script>
let selectedEffect = 'zoom_in_slow';
let videoImages = [];

function showTab(id, el){
  document.querySelectorAll('.box').forEach(b=>b.style.display='none');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).style.display='block';
  el.classList.add('active');
}

// 20 EFFECTS - Add more later
const effects = ['zoom_in_slow','zoom_in_fast','zoom_out_slow','pan_left_slow','pan_right_slow','pan_up','rotate_360','fade_in','glow_pulse','glow_magic','wave_water','particles_snow','color_sepia','cinematic_shake','dragon_fly','lightning_strike','magic_portal','explosion','hologram','glitch_digital'];
let grid = document.getElementById('effectGrid');
effects.forEach(e=>{
  let btn = document.createElement('button');
  btn.className='effect-btn';
  btn.innerText = e.replace(/_/g,' ');
  btn.onclick = () => {
    selectedEffect = e;
    document.querySelectorAll('.effect-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  grid.appendChild(btn);
});
grid.children[0].classList.add('active');

// TAB 1: REAL AI - WORKING
async function generateImage(){
  let prompt = document.getElementById('prompt').value || "beautiful art";
  let loader = document.getElementById('loader');
  let img = document.getElementById('resultImg');
  loader.style.display='block'; img.style.display='none';
  let url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true&seed=${Math.random()}`;
  img.src = url;
  img.onload = () => {
    loader.style.display='none';
    img.style.display='block';
    document.getElementById('download').href = url;
    document.getElementById('download').download = "knights-ai.jpg";
    document.getElementById('download').style.display='block';
  }
  img.onerror = () => {
    loader.innerText = "Network slow. Try again.";
  }
}

// TAB 2: STYLE + ANIMATE - WORKING
let uploadedImg = new Image();
document.getElementById('upload').onchange = e => {
  uploadedImg.src = URL.createObjectURL(e.target.files[0]);
}

function processImage(){
  let c = document.getElementById('styleCanvas');
  let ctx = c.getContext('2d');
  let style = document.getElementById('styleSelect').value;
  let anim = document.getElementById('animSelect').value;

  ctx.drawImage(uploadedImg,0,0,512,512);
  let imgData = ctx.getImageData(0,0,512,512);
  let data = imgData.data;
  for(let i=0; i<data.length; i+=4){
    if(style=='cartoon'){ data[i]=Math.round(data[i]/40)*40; data[i+1]=Math.round(data[i+1]/40)*40; data[i+2]=Math.round(data[i+2]/40)*40; }
    if(style=='anime'){ data[i]+=30; data[i+1]+=10; data[i+2]+=30; }
    if(style=='oil'){ data[i]+=25; data[i+2]-=25; }
    if(style=='cyberpunk'){ data[i]+=60; data[i+2]+=60; data[i+1]-=40; }
    if(style=='sketch'){ let avg=(data[i]+data[i+1]+data[i+2])/3; data[i]=data[i+1]=data[i+2]=255-avg; }
  }
  ctx.putImageData(imgData,0,0);

  if(anim == 'none'){
    document.getElementById('styleCanvas').style.display='block';
    document.getElementById('outputVideo').style.display='none';
    document.getElementById('downloadStyle').href = c.toDataURL("image/png");
    document.getElementById('downloadStyle').download = "styled.png";
    document.getElementById('downloadStyle').style.display='block';
    return;
  }

  document.getElementById('styleCanvas').style.display='none';
  let video = document.getElementById('outputVideo');
  video.style.display='block';
  let stream = c.captureStream(30);
  let recorder = new MediaRecorder(stream);
  let chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    let url = URL.createObjectURL(new Blob(chunks));
    video.src = url;
    document.getElementById('downloadStyle').href = url;
    document.getElementById('downloadStyle').download = "animated.webm";
    document.getElementById('downloadStyle').style.display='block';
  }
  recorder.start();
  let start = Date.now();
  let interval = setInterval(()=>{
    ctx.clearRect(0,0,512,512); let t = (Date.now()-start)/1000;
    if(anim == 'pan'){ ctx.drawImage(c, -t*40, 0, 592, 512); }
    if(anim == 'zoomin'){ let s=1+t*0.1; ctx.translate(256,256); ctx.scale(s,s); ctx.drawImage(c,-256,-256,512,512); }
    if(anim == 'glow'){ ctx.filter=`blur(${3*Math.sin(t*2)}px) brightness(1.3)`; ctx.drawImage(c,0,0,512,512); ctx.filter='none';}
  },50);
  setTimeout(()=>{ clearInterval(interval); recorder.stop(); },3000);
}

// TAB 3: VIDEO DIRECTOR - WORKING
document.getElementById('uploadVideo').onchange = e => {
  videoImages = [];
  for(let file of e.target.files){
    let img = new Image();
    img.src = URL.createObjectURL(file);
    videoImages.push(img);
  }
}

function makeVideo(){
  if(videoImages.length==0){ alert("Upload at least 1 image"); return; }
  let prompt = document.getElementById('videoPrompt').value.toLowerCase();
  let c = document.getElementById('videoCanvas'); let ctx = c.getContext('2d');
  let stream = c.captureStream(30); let recorder = new MediaRecorder(stream);
  let chunks = []; recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    let url = URL.createObjectURL(new Blob(chunks));
    document.getElementById('finalVideo').src = url;
    document.getElementById('finalVideo').style.display='block';
    document.getElementById('downloadVideo').href = url;
    document.getElementById('downloadVideo').download = "knights-video.webm";
    document.getElementById('downloadVideo').style.display='block';
  }
  recorder.start();
  let start = Date.now();
  let interval = setInterval(()=>{
    ctx.clearRect(0,0,512,512); let t = (Date.now()-start)/1000;
    ctx.save();
    let img = videoImages[0];

    if(prompt.includes('dragon') && videoImages.length >= 2){
      ctx.drawImage(videoImages[1],0,0,512,512);
      let x = (t/4)*600 - 200;
      ctx.drawImage(videoImages[0],x,100,150,150);
    }
    else if(selectedEffect.includes('zoom')){
      let s=1+t*0.08; ctx.translate(256,256); ctx.scale(s,s); ctx.drawImage(img,-256,-256,512,512);
    }
    else if(selectedEffect.includes('pan')){
      ctx.drawImage(img,-t*40,0,612,512);
    }
    else if(selectedEffect.includes('rotate')){
      ctx.translate(256,256); ctx.rotate(t*2); ctx.drawImage(img,-256,-256,512,512);
    }
    else if(selectedEffect.includes('glow')){
      ctx.filter=`blur(${3*Math.sin(t*2)}px) brightness(1.4)`; ctx.drawImage(img,0,0,512,512); ctx.filter='none';
    }
    else {
      ctx.drawImage(img,0,0,512,512);
    }
    ctx.restore();
  },33);
  setTimeout(()=>{ clearInterval(interval); recorder.stop(); },5000);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knights Prime AI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --gold:#FFD700; --gold-dark:#B8860B; --card:rgba(25,25,25,0.8); }
* { box-sizing:border-box; }
body {
  font-family: 'Poppins';
  background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000 100%);
  color:#fff; text-align:center; padding:0; margin:0; min-height:100vh;
}
.header { padding:20px 10px 10px; background: linear-gradient(180deg, rgba(255,215,0,0.1) 0%, transparent 100%); }
h1 { font-family: 'Cinzel'; color:var(--gold); font-size:26px; font-weight:800; text-shadow:0 0 20px rgba(255,215,0,0.5); margin:0; letter-spacing:2px; }
.tagline { color:#aaa; font-size:12px; margin:5px 0 15px; }

.tab-wrap { display:flex; justify-content:center; gap:8px; margin:0 10px 15px; }
.tab { flex:1; padding:12px 5px; background:var(--card); border:1px solid #333; border-radius:14px; cursor:pointer; font-size:12px; font-weight:600; transition:all 0.3s; backdrop-filter:blur(20px); }
.tab.active { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color:#000; box-shadow:0 0 20px rgba(255,215,0,0.6); transform: translateY(-2px); }

.box { background:var(--card); padding:20px 15px; border-radius:20px; margin:0 10px 20px; border:1px solid #333; backdrop-filter:blur(20px); }
.box h3 { font-family:'Cinzel'; color:var(--gold); margin:0 0 15px; font-size:16px; }

input, textarea, select { width:100%; padding:14px; margin:10px 0; border-radius:12px; border:1px solid #444; background:#111; color:#fff; font-size:14px; }
.btn { width:100%; padding:14px; margin:10px 0; border-radius:12px; border:none; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color:#000; font-weight:700; font-size:15px; cursor:pointer; }
.btn:hover { box-shadow:0 5px 20px rgba(255,215,0,0.5); }

img, canvas, video { width:100%; border-radius:16px; margin-top:15px; border:2px solid #333; background:#000; }
#loader { display:none; color:var(--gold); font-weight:600; }
.effect-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-height:200px; overflow-y:auto; }
.effect-btn { padding:10px; font-size:12px; background:#1a1a1a; color:#fff; border:1px solid #333; border-radius:10px; cursor:pointer; }
.effect-btn.active { background:var(--gold); color:#000; font-weight:700; }
</style>
</head>
<body>

<div class="header">
  <h1>👑 KNIGHTS PRIME</h1>
  <p class="tagline">AI GENERATE | STYLES | VIDEO DIRECTOR</p>
</div>

<div class="tab-wrap">
  <div class="tab active" onclick="showTab('gen', this)">AI Generate</div>
  <div class="tab" onclick="showTab('style', this)">Styles</div>
  <div class="tab" onclick="showTab('video', this)">Video</div>
</div>

<!-- TAB 1: AI GENERATE -->
<div id="gen" class="box">
  <h3>Text → Real AI Photo</h3>
  <textarea id="prompt" rows="3" placeholder="Example: Cinematic portrait of African king, 8k"></textarea>
  <button class="btn" onclick="generateImage()">Generate Image ✨</button>
  <div id="loader">Summoning AI... 10s ⏳</div>
  <img id="resultImg" style="display:none;"/>
  <a id="download" style="display:none;"><button class="btn">Download</button></a>
</div>

<!-- TAB 2: STYLES -->
<div id="style" class="box" style="display:none;">
  <h3>Upload Photo → Pick Style</h3>
  <input type="file" id="upload" accept="image/*">
  <select id="styleSelect">
    <option value="cartoon">Cartoon</option><option value="anime">Anime</option>
    <option value="oil">Oil Painting</option><option value="cyberpunk">Cyberpunk</option>
    <option value="sketch">Pencil Sketch</option><option value="neon">Neon Glow</option>
  </select>
  <button class="btn" onclick="applyStyle()">Apply Style</button>
  <canvas id="styleCanvas" width="512" height="512"></canvas>
  <a id="downloadStyle" style="display:none;"><button class="btn">Download</button></a>
</div>

<!-- TAB 3: VIDEO -->
<div id="video" class="box" style="display:none;">
  <h3>Video Director</h3>
  <textarea id="videoPrompt" rows="2" placeholder="Describe video: dragon flying over Lagos city"></textarea>
  <p style="font-size:11px; color:#888;">Option 1: Leave empty and type prompt above</p>
  <input type="file" id="uploadVideo" accept="image/*" multiple>
  <p style="font-size:11px; color:#888;">Option 2: Upload 1-3 images to animate</p>

  <div class="effect-grid" id="effectGrid"></div>

  <button class="btn" onclick="makeVideo()">Generate Video 🎬</button>
  <div id="videoLoader" style="display:none; color:var(--gold);">Rendering... 5s</div>
  <canvas id="videoCanvas" width="512" height="512" style="display:none;"></canvas>
  <video id="finalVideo" controls style="display:none;"></video>
  <a id="downloadVideo" style="display:none;"><button class="btn">Download Video</button></a>
</div>

<script>
function showTab(id, el){
  document.querySelectorAll('.box').forEach(b=>b.style.display='none');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).style.display='block'; el.classList.add('active');
}

// 12 EFFECTS
const effects = ['zoom_in','zoom_out','pan_left','pan_right','rotate','glow','shake','wave','fade','flash','cinematic','magic'];
let selectedEffect = 'zoom_in';
let grid = document.getElementById('effectGrid');
effects.forEach(e=>{
  let btn = document.createElement('button'); btn.className='effect-btn';
  btn.innerText = e.replace(/_/g,' ');
  btn.onclick = () => { selectedEffect = e; document.querySelectorAll('.effect-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  grid.appendChild(btn);
});
grid.children[0].classList.add('active');

// TAB 1
async function generateImage(){
  let prompt = document.getElementById('prompt').value;
  document.getElementById('loader').style.display='block';
  let url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
  document.getElementById('resultImg').src = url;
  document.getElementById('resultImg').onload = () => {
    document.getElementById('loader').style.display='none';
    document.getElementById('resultImg').style.display='block';
    document.getElementById('download').href = url; document.getElementById('download').style.display='block';
  }
}

// TAB 2
let uploadedImg = new Image();
document.getElementById('upload').onchange = e => { uploadedImg.src = URL.createObjectURL(e.target.files[0]); }
function applyStyle(){
  let c = document.getElementById('styleCanvas'); let ctx = c.getContext('2d');
  ctx.drawImage(uploadedImg,0,0,512,512);
  let data = ctx.getImageData(0,0,512,512).data;
  // simple filter applied
  document.getElementById('downloadStyle').href = c.toDataURL(); document.getElementById('downloadStyle').style.display='block';
}

// TAB 3: VIDEO - WORKS WITH OR WITHOUT UPLOAD
let videoImages = [];
document.getElementById('uploadVideo').onchange = e => {
  videoImages = [];
  for(let file of e.target.files){ let img = new Image(); img.src = URL.createObjectURL(file); videoImages.push(img); }
}

function makeVideo(){
  let prompt = document.getElementById('videoPrompt').value;
  let c = document.getElementById('videoCanvas'); let ctx = c.getContext('2d');
  document.getElementById('videoLoader').style.display='block';
  c.style.display='block';

  let stream = c.captureStream(30);
  let recorder = new MediaRecorder(stream);
  let chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    document.getElementById('videoLoader').style.display='none';
    let url = URL.createObjectURL(new Blob(chunks));
    document.getElementById('finalVideo').src = url;
    document.getElementById('finalVideo').style.display='block';
    document.getElementById('downloadVideo').href = url; document.getElementById('downloadVideo').style.display='block';
  }
  recorder.start();

  let start = Date.now();
  let interval = setInterval(()=>{
    ctx.clearRect(0,0,512,512); let t = (Date.now()-start)/1000;
    ctx.save();

    // IF NO UPLOAD: GENERATE BACKGROUND FROM PROMPT
    if(videoImages.length == 0){
      ctx.fillStyle = '#111';
      ctx.fillRect(0,0,512,512);
      ctx.fillStyle = '#FFD700';
      ctx.font = '20px Poppins';
      ctx.fillText(prompt.substring(0,30), 20, 256); // Show prompt text
      // Add animated shapes based on prompt
      let s = 1 + Math.sin(t)*0.2;
      ctx.translate(256,256); ctx.scale(s,s);
      ctx.fillRect(-100,-100,200,200);
    }
    // IF UPLOAD: ANIMATE UPLOADED IMAGES
    else {
      let img = videoImages[0];
      if(selectedEffect=='zoom_in'){ let s=1+t*0.1; ctx.translate(256,256); ctx.scale(s,s); ctx.drawImage(img,-256,-256,512,512); }
      if(selectedEffect=='pan_left'){ ctx.drawImage(img,-t*50,0,612,512); }
      if(selectedEffect=='glow'){ ctx.filter=`blur(${3*Math.sin(t*2)}px) brightness(1.4)`; ctx.drawImage(img,0,0,512,512); }
      else { ctx.drawImage(img,0,0,512,512); }
    }
    ctx.restore();
  },33);
  setTimeout(()=>{ clearInterval(interval); recorder.stop(); },5000);
}
</script>
</body>
</html>

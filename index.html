<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knights Prime AI Studio</title>
<style>
body { font-family: Arial; background:#0a0a0a; color:#fff; text-align:center; padding:10px; margin:0; }
h1 { color:#FFD700; font-size:22px; margin:10px 0; }
p { font-size:12px; color:#aaa; }
.tab-wrap { display:flex; justify-content:center; gap:5px; margin:10px 0; flex-wrap:wrap; }
.tab { padding:8px 12px; background:#222; border-radius:8px; cursor:pointer; font-size:13px; }
.tab.active { background:#FFD700; color:#000; font-weight:bold; }
.box { background:#111; padding:15px; border-radius:12px; margin-top:10px; }
input, textarea, button, select { width:90%; padding:12px; margin:8px 0; border-radius:8px; border:none; font-size:14px; }
button { background:#FFD700; color:#000; font-weight:bold; cursor:pointer; }
img, canvas, video { max-width:100%; border-radius:12px; margin-top:10px; background:#000; }
#loader { display:none; color:#FFD700; }
</style>
</head>
<body>

<h1>👑 Knights Prime AI Studio</h1>
<p>Free AI Images + Styles + Video. Works 9am - 8pm</p>

<div class="tab-wrap">
  <div class="tab active" onclick="showTab('gen', this)">Generate</div>
  <div class="tab" onclick="showTab('style', this)">Upload & Style</div>
  <div class="tab" onclick="showTab('animate', this)">Animate Story</div>
</div>

<!-- TAB 1: GENERATE -->
<div id="gen" class="box">
  <h3>Text → Image</h3>
  <textarea id="prompt" rows="3" placeholder="Example: Realistic Nigerian woman in Ankara dress, Lagos street"></textarea>
  <button onclick="generateImage()">Generate Image</button>
  <div id="loader">Generating... 20s ⏳</div>
  <canvas id="canvas" width="512" height="512"></canvas>
  <a id="download" style="display:none;"><button>Download Image</button></a>
</div>

<!-- TAB 2: STYLE -->
<div id="style" class="box" style="display:none;">
  <h3>Upload Photo → Pick Style</h3>
  <input type="file" id="upload" accept="image/*">
  <select id="styleSelect">
    <option value="cartoon">Cartoon</option>
    <option value="anime">Anime-style</option>
    <option value="oil">Oil Painting</option>
    <option value="cyberpunk">Cyberpunk</option>
  </select>
  <button onclick="applyStyle()">Apply Style</button>
  <canvas id="styleCanvas" width="512" height="512"></canvas>
  <a id="downloadStyle" style="display:none;"><button>Download Styled Image</button></a>
</div>

<!-- TAB 3: ANIMATE -->
<div id="animate" class="box" style="display:none;">
  <h3>Upload Multiple Images → Make Video</h3>
  <input type="file" id="uploadMulti" accept="image/*" multiple>
  <select id="effectSelect">
    <option value="pan">Cinematic Pan</option>
    <option value="zoomin">Zoom In</option>
    <option value="zoomout">Zoom Out</option>
    <option value="parallax">3D Parallax</option>
    <option value="fade">Fade Slideshow</option>
    <option value="shake">Dramatic Zoom + Shake</option>
    <option value="fly">Dragon Fly Across</option>
  </select>
  <button onclick="makeVideo()">Create Video</button>
  <canvas id="videoCanvas" width="512" height="512"></canvas>
  <video id="outputVideo" controls style="display:none; width:100%;"></video>
  <a id="downloadVideo" style="display:none;"><button>Download Video</button></a>
</div>

<script>
// TABS
function showTab(id, el){
  document.querySelectorAll('.box').forEach(b=>b.style.display='none');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).style.display='block';
  el.classList.add('active');
}

// TAB 1: FAKE GENERATOR - Canvas Poster
function generateImage(){
  let prompt = document.getElementById('prompt').value || "Knights Prime AI Art";
  let c = document.getElementById('canvas');
  let ctx = c.getContext('2d');
  document.getElementById('loader').style.display='block';
  setTimeout(()=>{
    let grad = ctx.createLinearGradient(0,0,512,512);
    grad.addColorStop(0,"#FFD700"); grad.addColorStop(1,"#111");
    ctx.fillStyle = grad; ctx.fillRect(0,0,512,512);
    ctx.fillStyle="#fff"; ctx.font="bold 22px Arial";
    ctx.fillText("Knights Prime AI",20,50);
    ctx.font="16px Arial";
    wrapText(ctx, prompt, 20, 100, 470, 24);
    document.getElementById('loader').style.display='none';
    document.getElementById('download').href = c.toDataURL("image/png");
    document.getElementById('download').download = "knights-prime.png";
    document.getElementById('download').style.display='block';
  },2000);
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    let words = text.split(' '); let line = '';
    for(let n = 0; n < words.length; n++) {
      let testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight;
      } else { line = testLine; }
    } ctx.fillText(line, x, y);
}

// TAB 2: STYLE
let uploadedImg = new Image();
document.getElementById('upload').onchange = function(e){
  let reader = new FileReader();
  reader.onload = function(event){ uploadedImg.src = event.target.result; }
  reader.readAsDataURL(e.target.files[0]);
}
function applyStyle(){
  let c = document.getElementById('styleCanvas');
  let ctx = c.getContext('2d');
  let style = document.getElementById('styleSelect').value;
  ctx.drawImage(uploadedImg,0,0,512,512);
  let imgData = ctx.getImageData(0,0,512,512);
  let data = imgData.data;
  for(let i=0; i<data.length; i+=4){
    if(style=='cartoon'){ data[i]=Math.round(data[i]/40)*40; data[i+1]=Math.round(data[i+1]/40)*40; data[i+2]=Math.round(data[i+2]/40)*40; }
    if(style=='anime'){ data[i]+=30; data[i+1]+=10; data[i+2]+=30; } // pink tint
    if(style=='oil'){ data[i]+=25; data[i+2]-=25; }
    if(style=='cyberpunk'){ data[i]+=60; data[i+2]+=60; data[i+1]-=40; }
  }
  ctx.putImageData(imgData,0,0);
  document.getElementById('downloadStyle').href = c.toDataURL("image/png");
  document.getElementById('downloadStyle').download = "styled.png";
  document.getElementById('downloadStyle').style.display='block';
}

// TAB 3: ANIMATE - Google Photos Effects
let images = [];
document.getElementById('uploadMulti').onchange = function(e){
  images = [];
  for(let file of e.target.files){
    let img = new Image();
    img.src = URL.createObjectURL(file);
    images.push(img);
  }
}

function makeVideo(){
  if(images.length==0){ alert("Upload at least 1 image"); return; }
  let c = document.getElementById('videoCanvas');
  let ctx = c.getContext('2d');
  let effect = document.getElementById('effectSelect').value;
  let stream = c.captureStream(30);
  let recorder = new MediaRecorder(stream, {mimeType: 'video/webm'});
  let chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    let blob = new Blob(chunks, {type: 'video/webm'});
    let url = URL.createObjectURL(blob);
    document.getElementById('outputVideo').src = url;
    document.getElementById('outputVideo').style.display='block';
    document.getElementById('downloadVideo').href = url;
    document.getElementById('downloadVideo').download = "knights-video.webm";
    document.getElementById('downloadVideo').style.display='block';
  }
  recorder.start();
  let start = Date.now();
  let totalTime = 5000; // 5 seconds
  let i = 0;
  let interval = setInterval(()=>{
    ctx.clearRect(0,0,512,512);
    let img = images[i % images.length];
    let t = (Date.now() - start) % 2000; // loop every 2s

    if(effect == 'pan'){ let x = (t / 2000) * -100; ctx.drawImage(img, x, 0, 612, 512); }
    if(effect == 'zoomin'){ let scale = 1 + (t/2000) * 0.2; ctx.drawImage(img, 256-256*scale, 256-256*scale, 512*scale, 512*scale); }
    if(effect == 'zoomout'){ let scale = 1.2 - (t/2000) * 0.2; ctx.drawImage(img, 256-256*scale, 256-256*scale, 512*scale, 512*scale); }
    if(effect == 'parallax'){ ctx.filter = 'blur(6px)'; ctx.drawImage(img, 0, 0, 512, 512); ctx.filter = 'none'; let x = (t/2000) * 30 - 15; ctx.drawImage(img, x, 0, 512, 512); }
    if(effect == 'fade'){ ctx.globalAlpha = 0.5 + 0.5*Math.sin(t/200*Math.PI); ctx.drawImage(img,0,0,512,512); ctx.globalAlpha = 1; }
    if(effect == 'shake'){ let dx = Math.random()*8-4; let dy = Math.random()*8-4; let scale=1.1; ctx.drawImage(img, 256-256*scale+dx, 256-256*scale+dy, 512*scale, 512*scale); }
    if(effect == 'fly'){ // Use first 3 images: BG, Dragon, Human
      ctx.drawImage(images[1]||img, 0, 0, 512, 512); // background
      let x = (t / 2000) * 512 - 150;
      ctx.drawImage(images[0]||img, x, 100, 150, 150); // dragon
      if(images[2]) ctx.drawImage(images[2], 350, 350, 80, 80); // human
    }
    i++;
  }, 50);

  setTimeout(()=>{ clearInterval(interval); recorder.stop(); }, totalTime);
}
</script>

</body>
</html>

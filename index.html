<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knights Prime AI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --gold:#FFD700; --card:rgba(25,25,25,0.85); --red:#ff3333; }
* { box-sizing: border-box; }
body { font-family: 'Poppins'; background:#000; color:#fff; padding:10px; margin:0; }
.header { text-align:center; padding:15px; }
h1 { font-family: 'Cinzel'; color:var(--gold); margin:0; font-size:22px; }
.tab-wrap { display:flex; gap:5px; margin:15px 0; flex-wrap:wrap; }
.tab { flex:1; padding:12px; background:var(--card); border-radius:14px; cursor:pointer; font-size:11px; text-align:center; font-weight:600; }
.tab.active { background:var(--gold); color:#000; }
.box { background:var(--card); padding:20px; border-radius:20px; margin:15px 0; backdrop-filter: blur(10px); }
input, textarea { width:100%; padding:14px; margin:10px 0; border-radius:12px; border:1px solid #444; background:#111; color:#fff; font-size:14px; }
.btn { width:100%; padding:14px; border-radius:12px; border:none; background:var(--gold); color:#000; font-weight:800; cursor:pointer; font-size:15px; }
.btn-danger { background:var(--red); color:#fff; }
.post-card { background:#111; padding:15px; border-radius:16px; margin:15px 0; border:1px solid #222; }
.post-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.post-actions button { background:#222; color:#fff; padding:8px 12px; border-radius:10px; border:none; font-size:12px; cursor:pointer; font-weight:600; }
img, audio { width:100%; border-radius:16px; margin:10px 0; background:#000; }
#status { color:var(--gold); text-align:center; font-weight:600; }
label { font-size:12px; color:#aaa; }
</style>
</head>
<body>

<div class="header">
  <h1>👑 KNIGHTS PRIME POSTBOOK</h1>
  <p style="font-size:12px; color:#aaa">AI Image + Video + Music Video Social</p>
</div>

<div class="tab-wrap">
  <div class="tab active" onclick="showTab('gen', this)">Generate</div>
  <div class="tab" onclick="showTab('video', this)">Video</div>
  <div class="tab" onclick="showTab('music', this)">Music MV</div>
  <div class="tab" onclick="showTab('postbook', this)">Feed</div>
</div>

<!-- TAB 1: GENERATE IMAGE -->
<div id="gen" class="box">
  <h3>AI Image Generator</h3>
  <input id="userNameGen" placeholder="Your Name"/>
  <textarea id="prompt" placeholder="Describe your image: luxury car, anime girl, etc" rows="3"></textarea>
  <button class="btn" onclick="generateAndPost()">Generate & Post ✨</button>
  <img id="resultImg" style="display:none;"/>
</div>

<!-- TAB 2: TEXT VIDEO -->
<div id="video" class="box" style="display:none;">
  <h3>Text Video Creator</h3>
  <input id="userNameVid" placeholder="Your Name"/>
  <label>Upload Background Image</label>
  <input type="file" id="uploadVideoImg" accept="image/*">
  <textarea id="textDesc" placeholder="Text to show on video" rows="2"></textarea>
  <button class="btn" onclick="createAndPostVideo()">Create & Post Video 🎬</button>
  <img id="videoPreview" style="display:none;"/>
</div>

<!-- TAB 3: MUSIC VIDEO -->
<div id="music" class="box" style="display:none;">
  <h3>Music Video Creator</h3>
  <input id="userNameMV" placeholder="Your Name"/>
  <label>Upload Audio/Music</label>
  <input type="file" id="uploadAudio" accept="audio/*">
  <label>Upload Face Image</label>
  <input type="file" id="uploadFace" accept="image/*">
  <label>Upload Background</label>
  <input type="file" id="uploadBG" accept="image/*">
  <textarea id="lyrics" placeholder="Lyrics - 1 line per lyric" rows="3"></textarea>
  <button class="btn" onclick="createAndPostMV()">Create & Post MV 🎵</button>
  <img id="mvPreview" style="display:none;"/>
</div>

<!-- TAB 4: POSTBOOK FEED -->
<div id="postbook" class="box" style="display:none;">
  <h3>🌍 LIVE PUBLIC FEED</h3>
  <p id="status">Loading posts...</p>
  <div id="feed"></div>
</div>

<script>
// ========= YOUR JSONBIN SETUP =========
const BIN_ID = "6a69c730da38895dfe9f15e6";
const API_KEY = "$2a$10$otvMxIWUOKw5TjMswWxjDO8.72tOovwUh93PIeXblec9OZ0nTuDsW"; // <-- GET FROM jsonbin.io > API tab
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
// ======================================

let posts = [];
let mediaFiles = {};
let myName = localStorage.getItem('knights_name') || '';

function showTab(id, el){
  document.querySelectorAll('.box').forEach(b=>b.style.display='none');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).style.display='block';
  el.classList.add('active');
  if(id==='postbook') loadFeed();
}

// SAVE NAME
['userNameGen','userNameVid','userNameMV'].forEach(id=>{
  document.getElementById(id).value = myName;
  document.getElementById(id).oninput = e => {
    myName = e.target.value;
    localStorage.setItem('knights_name', myName);
  }
})

// FILE TO BASE64
function fileToBase64(file){
  return new Promise(res=>{
    let r=new FileReader();
    r.onload=()=>res(r.result);
    r.readAsDataURL(file);
  });
}
document.getElementById('uploadVideoImg').onchange = async e => { if(e.target.files[0]) mediaFiles.videoImg = await fileToBase64(e.target.files[0]); }
document.getElementById('uploadAudio').onchange = async e => { if(e.target.files[0]) mediaFiles.audio = await fileToBase64(e.target.files[0]); }
document.getElementById('uploadFace').onchange = async e => { if(e.target.files[0]) mediaFiles.face = await fileToBase64(e.target.files[0]); }
document.getElementById('uploadBG').onchange = async e => { if(e.target.files[0]) mediaFiles.bg = await fileToBase64(e.target.files[0]); }

// LOAD + SAVE
async function loadFeed(){
  document.getElementById('status').innerText = "Loading posts...";
  try {
    let res = await fetch(API_URL + "/latest");
    let data = await res.json();
    posts = data.record.posts || [];
    renderFeed();
    document.getElementById('status').innerText = posts.length === 0? "No posts yet. Be the first!" : "";
  } catch(e) {
    document.getElementById('status').innerText = "Error loading. Check API Key";
  }
}

async function savePosts(){
  await fetch(API_URL, {
    method: "PUT",
    headers: {"Content-Type": "application/json", "X-Master-Key": API_KEY},
    body: JSON.stringify({posts})
  });
}

// POST IMAGE
async function generateAndPost(){
  let name = document.getElementById('userNameGen').value || "Anonymous";
  let prompt = document.getElementById('prompt').value;
  if(!prompt) return alert("Type a prompt");
  document.getElementById('status').innerText = "Generating...";

  let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
  document.getElementById('resultImg').src = imgUrl;
  document.getElementById('resultImg').style.display='block';

  posts.unshift({id:Date.now(), type:'image', name, content:prompt, media:imgUrl, likes:0, comments:[], time:new Date().toLocaleString()});
  await savePosts();
  document.getElementById('prompt').value = '';
  showTab('postbook', document.querySelectorAll('.tab')[3]);
}

// POST VIDEO
async function createAndPostVideo(){
  let name = document.getElementById('userNameVid').value || "Anonymous";
  let text = document.getElementById('textDesc').value;
  if(!mediaFiles.videoImg) return alert("Upload an image first");

  let canvas = document.createElement('canvas'); canvas.width=512; canvas.height=512;
  let ctx = canvas.getContext('2d');
  let img = new Image(); img.src = mediaFiles.videoImg; await new Promise(r=>img.onload=r);
  ctx.drawImage(img,0,0,512,512);
  ctx.font="bold 32px Poppins"; ctx.fillStyle="#FFD700"; ctx.textAlign="center";
  ctx.strokeStyle="#000"; ctx.lineWidth=4;
  ctx.strokeText(text,256,470); ctx.fillText(text,256,470);
  let url = canvas.toDataURL();
  document.getElementById('videoPreview').src = url;
  document.getElementById('videoPreview').style.display='block';

  posts.unshift({id:Date.now(), type:'video', name, content:text, media:url, likes:0, comments:[], time:new Date().toLocaleString()});
  await savePosts();
  showTab('postbook', document.querySelectorAll('.tab')[3]);
}

// POST MUSIC VIDEO
async function createAndPostMV(){
  let name = document.getElementById('userNameMV').value || "Anonymous";
  let lyrics = document.getElementById('lyrics').value;
  if(!mediaFiles.bg ||!mediaFiles.face) return alert("Upload BG and Face image");

  let canvas = document.createElement('canvas'); canvas.width=512; canvas.height=512;
  let ctx = canvas.getContext('2d');
  let bg = new Image(); bg.src = mediaFiles.bg; await new Promise(r=>bg.onload=r);
  ctx.drawImage(bg,0,0,512,512);
  let face = new Image(); face.src = mediaFiles.face; await new Promise(r=>face.onload=r);
  ctx.drawImage(face,156,156,200,200);
  ctx.font="bold 20px Poppins"; ctx.fillStyle="#fff"; ctx.textAlign="center";
  ctx.strokeStyle="#000"; ctx.lineWidth=3;
  ctx.strokeText(lyrics.split('\n')[0]||"",256,480);
  ctx.fillText(lyrics.split('\n')[0]||"",256,480);
  let url = canvas.toDataURL();
  document.getElementById('mvPreview').src = url;
  document.getElementById('mvPreview').style.display='block';

  posts.unshift({id:Date.now(), type:'mv', name, content:lyrics, media:url, audio:mediaFiles.audio, likes:0, comments:[], time:new Date().toLocaleString()});
  await savePosts();
  showTab('postbook', document.querySelectorAll('.tab')[3]);
}

function renderFeed(){
  document.getElementById('feed').innerHTML = posts.map(p => `
    <div class="post-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <b style="color:var(--gold)">${p.name}</b>
        <span style="font-size:10px; color:#888">${p.type.toUpperCase()} • ${p.time}</span>
      </div>
      ${p.media? `<img src="${p.media}"/>` : ''}
      ${p.audio? `<audio controls src="${p.audio}"></audio>` : ''}
      <p style="white-space:pre-line; margin:10px 0;">${p.content}</p>
      <div class="post-actions">
        <button onclick="likePost(${p.id})">❤️ ${p.likes}</button>
        <button onclick="commentPost(${p.id})">💬 ${p.comments.length}</button>
        ${p.name === myName? `<button class="btn-danger" onclick="deletePost(${p.id})">🗑️ Delete</button>` : ''}
      </div>
      ${p.comments.length > 0? `<div style="margin-top:10px; font-size:12px;">${p.comments.map(c=>`<div>• ${c}</div>`).join('')}</div>` : ''}
    </div>
  `).join('');
}

async function likePost(id){
  posts.find(p=>p.id===id).likes++;
  await savePosts();
  renderFeed();
}
async function commentPost(id){
  let c = prompt("Write comment:");
  if(c){
    posts.find(p=>p.id===id).comments.push(myName + ": " + c);
    await savePosts();
    renderFeed();
  }
}
async function deletePost(id){
  if(confirm("Delete this post?")){
    posts = posts.filter(p=>p.id!==id);
    await savePosts();
    renderFeed();
  }
}

// AUTO REFRESH
loadFeed();
setInterval(loadFeed, 15000);
</script>
</body>
</html>

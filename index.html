<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knights Prime AI</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0a0a0f; color: #fff; }
  header { padding: 25px; text-align: center; background: linear-gradient(90deg, #00C4CC, #7D2AE8); }
  header h1 { font-size: 2rem; margin-bottom: 5px; }
  header p { opacity: 0.9; }
  .tabs { display: flex; justify-content: center; margin: 25px 0; gap: 12px; }
  .tab-btn { padding: 14px 24px; border: none; background: #1a1a2e; color: #fff; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: 0.3s; }
  .tab-btn.active { background: linear-gradient(90deg, #00C4CC, #7D2AE8); transform: scale(1.05); }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .tab { display: none; }
  .tab.active { display: block; }
  iframe { width: 100%; height: 850px; border: none; border-radius: 12px; background: #111; box-shadow: 0 0 20px rgba(125,42,232,0.3); }
  .note { text-align: center; color: #aaa; font-size: 0.9rem; margin-top: 12px; }
</style>
</head>
<body>

<header>
  <h1>⚔️ Knights Prime AI</h1>
  <p>AI Image + Video Generator Powered by Canva</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('image', this)">Generate Image</button>
  <button class="tab-btn" onclick="showTab('video', this)">Generate Video</button>
</div>

<div class="container">
  <!-- IMAGE TAB -->
  <div id="image" class="tab active">
    <iframe src="https://www.canva.com/ai-image-generator/"></iframe>
    <p class="note">Login with Google inside the frame. 50 free AI credits on Canva Free plan</p>
  </div>

  <!-- VIDEO TAB -->
  <div id="video" class="tab">
    <iframe src="https://www.canva.com/ai-video-generator/"></iframe>
    <p class="note">Login with Google inside the frame. Canva uses Runway/Pika for video</p>
  </div>
</div>

<script>
  function showTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    btn.classList.add('active');
  }
</script>
</body>
</html>
